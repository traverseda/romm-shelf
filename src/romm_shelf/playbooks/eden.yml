# Eden for every game: saves in the layout, Vulkan, fullscreen, no first-run or close prompt, and
# the Switch update/DLC folder (design.md § Bundled emulators, Eden). The controller mapping is
# seeded on the first run; this patch changes settings, key by key.
#
# ansible.builtin only. Eden's qt-config.ini is INI-like; keys are unique across its sections.
# The external content folder is an array entry, so it is written only when none is set: a user's
# own external folders are never replaced.
- name: Eden settings
  hosts: all  # a scoped patch runs for its targets, one host each
  gather_facts: false
  vars:
    x_scope: emulator
    x_emulators: [eden]
    x_settings:
      resolution:
        title: Resolution scale
        description: >-
          Eden's internal resolution. 1x is the Switch's native rendering; higher is sharper
          and heavier.
        choices:
          "1": 1x
          "2": 2x
          "3": 3x
          "4": 4x
        default: "1"
    external: "{{ eden == 'external' }}"
    target: "{{ eden_local_config | expanduser if external else eden_config }}"
    config: "{{ target }}/qt-config.ini"
    nand: "{{ saves }}/switch/eden/nand"
    sdmc: "{{ saves }}/switch/eden/sdmc"
    content: "{{ roms }}/switch/.content"
    resolution_setup: "{{ {'1': '3', '2': '6', '3': '7', '4': '8'}[resolution] }}"
    settings:
      - {section: "Data%20Storage", key: nand_directory, value: "{{ nand }}"}
      - {section: "Data%20Storage", key: sdmc_directory, value: "{{ sdmc }}"}
      - {section: Renderer, key: backend, value: "1"}
      - {section: Renderer, key: resolution_setup, value: "{{ resolution_setup }}"}
      - {section: Renderer, key: use_vsync, value: "2"}
      - {section: Renderer, key: fullscreen_mode, value: "1"}
      - {section: Miscellaneous, key: first_launch, value: "false"}
      - {section: System, key: use_docked_mode, value: "1"}
      - {section: UI, key: fullscreen, value: "true"}
      - {section: UI, key: firstStart, value: "false"}
      - {section: UI, key: confirmStop, value: "2"}
      - {section: UI, key: check_for_updates, value: "false"}
      - {section: UI, key: enable_gamemode, value: "false"}
      - {section: UI, key: pauseWhenInBackground, value: "false"}
  tasks:
    - name: Find Eden's config
      ansible.builtin.stat:
        path: "{{ config }}"
      register: config_file

    - name: Make the NAND and SD card folders
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: ["{{ nand }}", "{{ sdmc }}"]
      when: config_file.stat.exists

    - name: Config sections
      ansible.builtin.lineinfile:
        path: "{{ config }}"
        line: "[{{ item }}]"
        create: true
        mode: "0644"
      loop: ["Data%20Storage", Renderer, Miscellaneous, System, UI, Paths]
      when: config_file.stat.exists

    - name: Config settings
      ansible.builtin.lineinfile:
        path: "{{ config }}"
        regexp: '^{{ item.key | regex_escape }}='
        line: "{{ item.key }}={{ item.value }}"
        insertafter: '^\[{{ item.section }}\]$'
        create: true
        mode: "0644"
      loop: "{{ settings }}"
      loop_control:
        label: "{{ item.section }} {{ item.key }}"
      when: config_file.stat.exists

    - name: Read Eden's config for the content folder
      ansible.builtin.slurp:
        src: "{{ config }}"
      register: config_text
      when: config_file.stat.exists

    - name: Add the Switch updates and DLC folder
      ansible.builtin.lineinfile:
        path: "{{ config }}"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        insertafter: '^\[Paths\]$'
        create: true
        mode: "0644"
      loop:
        - {regexp: '^external_content_dirs\\size=', line: 'external_content_dirs\size=1'}
        - {regexp: '^external_content_dirs\\0\\path=', line: 'external_content_dirs\0\path={{ content }}'}
      when:
        - config_file.stat.exists
        - "'external_content_dirs' not in (config_text.content | b64decode)"
