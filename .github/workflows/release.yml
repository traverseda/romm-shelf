name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The runner has ~14 GB free and the pack tarballs plus the Nix store are large.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/lib/jvm \
            /opt/microsoft \
            /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker image prune -af || true
          docker builder prune -af || true
          df -h /

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 12G

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo

      - name: Version
        id: version
        run: |
          source scripts/lib.sh
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build artifacts
        run: scripts/release.sh

      - name: Publish emulator packs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | \
            skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          scripts/publish-packs.sh

      - name: Stage PyPI distributions
        if: vars.PYPI_PUBLISH == 'true'
        run: |
          mkdir -p dist/pypi
          cp dist/*.whl dist/*.tar.gz dist/pypi/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          prerelease=()
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/romm-shelf-$VERSION-x86_64.AppImage" \
            "dist/romm_shelf-$VERSION-py3-none-any.whl" \
            "dist/romm_shelf-$VERSION.tar.gz" \
            dist/SHA256SUMS \
            dist/latest.json \
            --title "romm-shelf $VERSION" \
            --generate-notes \
            "${prerelease[@]}"

      - name: Publish to PyPI
        if: vars.PYPI_PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi
